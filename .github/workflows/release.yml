name: Release image

# Publish the Docker image to GitHub Container Registry after CI passes on main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only CI runs for pushes to this repository's main branch. CI also runs on
    # pull requests, and a fork's PR from its own "main" would otherwise match
    # the branch filter above and publish unmerged code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name and commit
        # Registry names must be lowercase; the repository name isn't.
        # SHA is the commit CI tested and this job checked out.
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Tag and label with the built commit rather than the workflow_run
          # context's SHA (main's head, possibly newer). context: git can't be
          # used: it fails on the detached, shallow checkout above.
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
